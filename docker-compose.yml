version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pwa-messaging-db
    environment:
      POSTGRES_USER: ${DB_USER:-messaging_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: ${DB_NAME:-messaging_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-messaging_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pwa-messaging-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-messaging_app}
      DB_USER: ${DB_USER:-messaging_user}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://ollama:11434}
      EMAIL_SERVICE: ${EMAIL_SERVICE:-sendgrid}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@yourdomain.com}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
    networks:
      - app-network
    restart: unless-stopped

  # Vue.js Frontend (served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pwa-messaging-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # Ollama (Optional - for chatbot functionality)
  ollama:
    image: ollama/ollama:latest
    container_name: pwa-messaging-ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - with-ollama  # Run with: docker-compose --profile with-ollama up

volumes:
  postgres_data:
  ollama_data:

networks:
  app-network:
    driver: bridge
